# Microsoft Presidio Analyzer for vela-privacy's NER-based detection.
#   docker compose -f examples/presidio/docker-compose.yml up -d
#   npx vela-privacy proxy --presidio-url http://localhost:5002
services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "127.0.0.1:5002:3000" # loopback only: the analyzer sees raw text
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
